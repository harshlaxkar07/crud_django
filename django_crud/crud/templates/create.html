{% extends 'base.html' %}

{% block title %}Add a member &mdash; Member Directory{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <h1>Add a member</h1>
    <p>Names accept letters only, the email is checked for shape, and every field is validated before the record is saved.</p>
  </div>
</div>

<div class="card" style="max-width:720px">
  <div class="card-body">
    <form method="POST">
      {% csrf_token %}
      <div class="form-grid">{{ form.as_p }}</div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          Save member
        </button>
        <a class="btn" href="{% url 'read' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
